<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="AiDHDen" />
<meta name="theme-color" content="#0b0b0f" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icon-180.png" />
<link rel="icon" type="image/png" sizes="180x180" href="/icon-180.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<title>AiDHDen</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --card-2: #f2f2f7;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --accent: #10b981;
    --accent-dim: rgba(16, 185, 129, 0.12);
    --accent-faint: rgba(16, 185, 129, 0.04);
    --accent-2: #2563eb;
    --danger: #dc2626;
    --border: #e5e5ea;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --surface-grad: linear-gradient(180deg, var(--accent-dim) 0%, var(--card) 60%);
    --page-grad:    linear-gradient(180deg, var(--accent-faint) 0%, var(--bg) 380px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--page-grad);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, sans-serif;
    font-size: 16px;
    overscroll-behavior-y: contain;
  }
  body {
    padding: calc(var(--safe-top) + 8px) 16px calc(var(--safe-bottom) + 90px);
    min-height: 100vh;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 4px; }
  h1 .count {
    font-size: 14px; font-weight: 600;
    color: var(--muted); letter-spacing: 0;
    margin-left: 8px; vertical-align: 2px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 18px 0 10px; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; }
  .btn { appearance: none; border: none; background: var(--accent); color: #ffffff; font-weight: 700; font-size: 16px; padding: 12px 16px; border-radius: 12px; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  .btn.secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: transparent; color: var(--danger); padding: 6px 10px; font-weight: 500; }
  .btn.wide { width: 100%; }
  input, select {
    appearance: none;
    background: var(--card-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-size: 16px; width: 100%; font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }

  .group-heading {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted);
    margin: 18px 4px 8px;
  }
  .group-heading:first-child { margin-top: 8px; }

  .tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 8px 8px calc(var(--safe-bottom) + 8px);
    z-index: 50;
  }
  .tab { flex: 1; text-align: center; padding: 4px 2px; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; border-radius: 10px; min-width: 0; }
  .tab .ticon { font-size: 20px; display: block; line-height: 1; margin-bottom: 2px; }
  .tab.active { color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }

  .weigh-strip {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 10px;
    margin-bottom: 8px;
  }
  .weigh-strip .strip-icon { font-size: 16px; color: var(--muted); flex-shrink: 0; }
  .weigh-strip .strip-current { font-size: 14px; font-weight: 700; }
  .weigh-strip .strip-delta { font-size: 11px; color: var(--muted); }
  .weigh-strip .strip-delta.down { color: var(--accent); }
  .weigh-strip .strip-delta.up { color: var(--danger); }
  .weigh-strip .strip-spacer { flex: 1; }
  .weigh-strip .strip-input {
    width: 58px; padding: 6px 4px; font-size: 13px;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .weigh-strip .strip-btn { padding: 6px 10px; font-size: 12px; }

  #view-today.active {
    display: flex;
    flex-direction: column;
    min-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 180px);
  }
  #view-today .weigh-strip { flex: 0 0 auto; }
  #view-today #habit-list {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .habits-grid {
    display: flex; flex-direction: column;
    gap: 10px;
    flex: 1 1 0;
    min-height: 0;
  }
  .habit-tile {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    gap: 6px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid rgba(0, 0, 0, 0.04);
    border-radius: 20px;
    cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 56px;
    flex: 1 1 0;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 14px rgba(0, 0, 0, 0.03);
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1),
                box-shadow 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
    overflow: hidden;
  }
  .habit-tile::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 55%);
    pointer-events: none;
    opacity: 0.9;
  }
  .habit-tile:active {
    transform: scale(0.975);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .habit-tile.done {
    background: linear-gradient(180deg, rgba(16,185,129,0.14) 0%, rgba(16,185,129,0.05) 100%);
    border-color: rgba(16, 185, 129, 0.28);
    box-shadow: 0 1px 2px rgba(16,185,129,0.10), 0 6px 18px rgba(16,185,129,0.08);
  }
  .habit-tile .habit-icon {
    position: relative;
    font-size: 22px; color: var(--text);
    text-align: center;
    opacity: 0.9;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .habit-tile.done .habit-icon {
    color: var(--accent);
    transform: scale(1.05);
  }
  .habit-tile .habit-name {
    position: relative;
    font-size: 15px; font-weight: 600;
    line-height: 1.2; letter-spacing: -0.015em;
    color: var(--text);
  }
  .habit-tile.done .habit-name { color: var(--accent); }
  .habit-tile .habit-streak {
    position: relative;
    font-size: 11px; font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  .habit-tile.done .habit-streak { color: var(--accent); opacity: 0.9; }

  @media (orientation: landscape) and (max-height: 600px) {
    .habits-grid {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 6px;
    }
    .habits-grid .habit-tile {
      flex: 1 1 calc(33.333% - 6px);
      min-width: 0;
      padding: 8px 10px;
      min-height: 42px;
      border-radius: 14px;
      gap: 2px;
    }
    .habits-grid .habit-tile .habit-icon { font-size: 16px; }
    .habits-grid .habit-tile .habit-name { font-size: 12px; }
    .habits-grid .habit-tile .habit-streak { font-size: 9px; }
    h1 { font-size: 20px; margin: 4px 0 2px; }
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 400;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-overlay.show { display: flex; }
  .modal-card {
    background: white;
    border-radius: 18px;
    padding: 24px 20px 16px;
    width: 100%; max-width: 320px;
    text-align: center;
  }
  .modal-card .mc-icon {
    font-size: 38px; color: var(--accent);
    line-height: 1; margin-bottom: 8px;
  }
  .modal-card h3 { font-size: 18px; font-weight: 700; margin: 4px 0 6px; }
  .modal-card p { font-size: 14px; color: var(--muted); margin: 0 0 18px; line-height: 1.45; }
  .modal-card .mc-btns { display: flex; gap: 10px; }
  .modal-card .mc-btns button {
    flex: 1;
    padding: 12px;
    font-size: 14px; font-weight: 700;
    border-radius: 10px;
    border: none; cursor: pointer;
    font-family: inherit;
  }
  .modal-card .mc-cancel {
    background: var(--card-2); color: var(--text);
    border: 1px solid var(--border);
  }
  .modal-card .mc-confirm { background: var(--accent); color: white; }

  /* Login screen (auth gate) */
  .login-screen {
    position: fixed; inset: 0; z-index: 700;
    background: #ffffff;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px;
  }
  .login-screen.show { display: flex; }
  .login-content { max-width: 320px; width: 100%; text-align: center; }
  .login-wordmark {
    font-family: "Poppins", -apple-system, system-ui, sans-serif;
    font-size: 32px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1;
    margin-bottom: 28px;
  }
  .login-wordmark .adhd { color: #1c1c1e; }
  .login-wordmark .accent { color: #10b981; }
  .login-screen h2 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .login-sub {
    color: var(--muted); font-size: 14px;
    margin: 0 0 24px; line-height: 1.5;
  }
  .login-screen input[type="password"],
  .login-screen input[type="tel"] {
    width: 100%; padding: 14px; font-size: 22px;
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 10px;
    text-align: center; box-sizing: border-box;
    font-weight: 700;
    letter-spacing: 0.3em;
    font-variant-numeric: tabular-nums;
  }
  .login-screen input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .login-screen .btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; }
  #login-status {
    margin-top: 16px; font-size: 13px;
    color: var(--muted); min-height: 18px;
    line-height: 1.4;
  }
  #login-status.success { color: var(--accent); font-weight: 600; }
  #login-status.error { color: var(--danger); }

  .today-head {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .today-head h1 { margin: 8px 0 4px; }

  /* Challenge tab */
  .challenge-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px;
    margin-bottom: 14px;
  }
  .challenge-card.active {
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--accent-dim) 0%, var(--card) 60%);
  }
  .challenge-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .challenge-head .ico {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--card-2); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .challenge-card.active .challenge-head .ico { background: var(--accent); color: white; }
  .challenge-head .meta { flex: 1; }
  .challenge-head h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .challenge-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .challenge-timer { text-align: center; padding: 10px 0 18px; }
  .challenge-timer .big {
    font-size: 48px; font-weight: 800; letter-spacing: -0.03em;
    line-height: 1; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .challenge-timer .label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-top: 6px;
  }
  .challenge-start-btn {
    width: 100%; padding: 16px;
    border: 0; border-radius: 999px;
    background: var(--accent); color: white;
    font-weight: 800; font-size: 15px;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .challenge-stop-btn {
    width: 100%; padding: 12px;
    border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--danger);
    font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: inherit;
    margin-top: 12px;
  }
  .challenge-now {
    background: var(--accent); color: white;
    border-radius: 14px;
    padding: 14px 16px;
    margin: 12px 0 16px;
  }
  .challenge-now .stage {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    opacity: 0.85; margin-bottom: 4px;
  }
  .challenge-now .text { font-size: 14px; line-height: 1.45; font-weight: 600; }
  .challenge-feed { margin-top: 12px; }
  .challenge-feed .feed-cap {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin: 0 0 8px;
  }
  .feed-row {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 12px; border-radius: 10px;
    background: var(--card-2);
    margin-bottom: 6px;
  }
  .feed-row.past { opacity: 0.55; }
  .feed-row .h {
    font-size: 12px; font-weight: 800; color: var(--muted);
    min-width: 44px; padding-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .feed-row .b { font-size: 13px; line-height: 1.45; color: var(--text); }
  .challenge-intro { text-align: center; padding: 10px 4px 20px; }
  .challenge-intro .label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  .challenge-intro h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .challenge-intro p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

  /* Weight tab */
  .mp-clean {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 22px 12px;
    margin-bottom: 14px;
  }
  .mp-clean .mc-cap {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .mp-clean .mc-pct {
    font-size: 60px; font-weight: 800;
    letter-spacing: -0.04em; line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .mp-clean .mc-pct .sign {
    font-size: 28px; font-weight: 700; color: var(--muted);
    margin-left: 4px; vertical-align: 8px;
  }
  .mp-clean .mc-pct.done { color: var(--accent); }
  .mp-clean .mc-sub {
    font-size: 13px; color: var(--muted);
    margin: 6px 0 18px;
    letter-spacing: -0.005em;
  }
  .mp-clean .mc-row {
    display: flex; justify-content: space-between;
    align-items: baseline;
    padding: 11px 0;
    font-size: 14px;
    border-top: 0.5px solid var(--border);
  }
  .mp-clean .mc-row .mc-k { color: var(--muted); }
  .mp-clean .mc-row .mc-v {
    font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .mp-clean .mc-row .mc-v.accent { color: var(--accent); }
  .mp-clean .mc-row .mc-v.danger { color: var(--danger); }
  .mp-clean .mc-edit {
    display: block; width: 100%;
    background: transparent; color: var(--accent-2);
    border: none; font-size: 13px; font-weight: 600;
    padding: 14px 0 4px;
    cursor: pointer; font-family: inherit;
    border-top: 0.5px solid var(--border);
    margin-top: 4px;
  }
  .weight-range-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px;
  }
  .weight-range-row h2 { margin: 0; }
  .range-toggle {
    display: flex; gap: 2px;
    background: var(--card-2); border-radius: 999px;
    padding: 3px;
  }
  .range-btn {
    background: transparent; border: 0;
    padding: 6px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    cursor: pointer; font-family: inherit;
  }
  .range-btn.active {
    background: var(--card); color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  ul.list li:last-child { border-bottom: none; }
  .pad { padding: 14px; }
  .ti { vertical-align: middle; }
</style>
</head>
<body>

  <div class="today-head">
    <div>
      <h1 id="greeting">Today</h1>
      <p class="subtitle" id="today-date"></p>
    </div>
  </div>

  <!-- TODAY -->
  <section class="view active" id="view-today">

    <div class="weigh-strip">
      <i class="ti ti-scale strip-icon" aria-hidden="true"></i>
      <span class="strip-current" id="weigh-latest">—</span>
      <span class="strip-delta" id="weigh-delta"></span>
      <div class="strip-spacer"></div>
      <input type="number" step="0.1" inputmode="decimal" placeholder="kg" id="quick-weight" class="strip-input" />
      <button class="btn strip-btn" id="quick-save-weight">Log</button>
    </div>

    <div id="habit-list"></div>
  </section>

  <!-- CHALLENGE -->
  <section class="view" id="view-challenge"></section>

  <!-- WEIGHT -->
  <section class="view" id="view-weight">
    <div class="mp-clean" id="month-progress-lg" style="display: none;">
      <div class="mc-cap" id="mc-cap">MAY</div>
      <div class="mc-pct" id="mc-pct">0<span class="sign">%</span></div>
      <div class="mc-sub" id="mc-sub">of your monthly goal</div>
      <div class="mc-row"><span class="mc-k">Lost this month</span><span class="mc-v accent" id="mc-lost">—</span></div>
      <div class="mc-row"><span class="mc-k">Remaining</span><span class="mc-v" id="mc-togo">—</span></div>
      <div class="mc-row"><span class="mc-k">Start of month</span><span class="mc-v" id="mc-start">—</span></div>
      <div class="mc-row"><span class="mc-k">Goal</span><span class="mc-v" id="mc-goal">—</span></div>
      <button class="mc-edit" id="mp-lg-edit">Edit goal</button>
    </div>

    <div class="weight-range-row">
      <h2 id="weight-range-title">Last 30 days</h2>
      <div class="range-toggle" id="weight-range-toggle" role="tablist">
        <button class="range-btn" data-range="7">7d</button>
        <button class="range-btn active" data-range="30">30d</button>
      </div>
    </div>
    <div class="card pad">
      <div id="weight-chart"></div>
    </div>

    <h2>Log weight</h2>
    <div class="card pad">
      <div class="row">
        <div class="grow">
          <label for="weight-input">Weight (kg)</label>
          <input id="weight-input" type="number" step="0.1" inputmode="decimal" placeholder="e.g. 78.5" />
        </div>
        <button class="btn" id="save-weight" style="margin-top: 16px;">Save</button>
      </div>
    </div>

    <h2>History</h2>
    <div class="card pad">
      <ul class="list" id="weight-list">
        <li class="muted" style="justify-content:center;">No weight entries yet.</li>
      </ul>
    </div>
  </section>

  <!-- Login screen -->
  <div id="login-screen" class="login-screen" role="dialog" aria-label="Unlock">
    <div class="login-content">
      <div class="login-wordmark">
        <span class="adhd">A</span><span class="accent">i</span><span class="adhd">DHD</span><span class="accent">en</span>
      </div>
      <h2 id="login-title">Enter PIN</h2>
      <p class="login-sub">Enter your 4-digit PIN to unlock.</p>
      <input type="password" id="login-pin" placeholder="••••" inputmode="numeric" maxlength="8" autocomplete="off" pattern="[0-9]*" />
      <button class="btn" id="login-unlock-btn">Unlock</button>
      <div id="login-status"></div>
    </div>
  </div>

  <!-- Monthly goal modal -->
  <div id="goal-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="mc-icon"><i class="ti ti-target"></i></div>
      <h3 id="goal-modal-title">Monthly goal</h3>
      <p id="goal-modal-sub">What's your target weight by the end of the month?</p>
      <input id="goal-input" type="number" step="0.1" inputmode="decimal" placeholder="kg" style="width: 100%; padding: 12px; font-size: 16px; text-align: center; background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; margin-bottom: 14px;" />
      <div class="mc-btns">
        <button id="goal-skip" class="mc-cancel">Skip</button>
        <button id="goal-save" class="mc-confirm">Set goal</button>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <nav class="tabs">
    <div class="tab active" data-view="today"><i class="ti ti-checks ticon" aria-hidden="true"></i>Today</div>
    <div class="tab" data-view="weight"><i class="ti ti-scale ticon" aria-hidden="true"></i>Weigh In</div>
    <div class="tab" data-view="challenge"><i class="ti ti-flame ticon" aria-hidden="true"></i>Challenge</div>
  </nav>

<script>
const KEY = "fitness_v10";
const CATEGORIES = ["Nutrition", "Fitness", "Wellness"];

const DEFAULT_HABITS = [
  { id: 1006, icon: "ti-snowflake",   name: "Cold shower",    cat: "Wellness"  },
  { id: 1002, icon: "ti-bolt",        name: "HIIT Workout",   cat: "Fitness"   },
  { id: 1001, icon: "ti-walk",        name: "10,000 steps",   cat: "Fitness"   },
  { id: 1007, icon: "ti-pill",        name: "Creatine",       cat: "Nutrition" },
  { id: 1004, icon: "ti-meat",        name: "160g protein",   cat: "Nutrition" },
  { id: 1005, icon: "ti-flame",       name: "2200 cals",      cat: "Nutrition" },
  { id: 1003, icon: "ti-bottle-off",  name: "No alcohol",     cat: "Wellness"  },
];

function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { habits: DEFAULT_HABITS.slice(), log: {}, weights: [], nextId: 1008 };
}
function saveData() { localStorage.setItem(KEY, JSON.stringify(data)); }
let data = loadData();

const HABITS_SCHEMA_VERSION = 5;
function runMigrations() {
  let dirty = false;
  if (data.habitsSchemaVersion !== HABITS_SCHEMA_VERSION || !Array.isArray(data.habits) || data.habits.length !== DEFAULT_HABITS.length) {
    const oldHabits = Array.isArray(data.habits) ? data.habits : [];
    const nameToOldId = {};
    for (const h of oldHabits) {
      if (h && h.name) nameToOldId[h.name.trim().toLowerCase()] = h.id;
    }
    const newLog = {};
    for (const dateKey of Object.keys(data.log || {})) {
      const entry = data.log[dateKey] || {};
      const newEntry = {};
      for (const newH of DEFAULT_HABITS) {
        const oldId = nameToOldId[newH.name.trim().toLowerCase()];
        if (oldId != null && entry[oldId] != null) {
          newEntry[newH.id] = entry[oldId];
        }
      }
      newLog[dateKey] = newEntry;
    }
    data.habits = DEFAULT_HABITS.slice();
    data.log = newLog;
    data.nextId = 1008;
    data.habitsSchemaVersion = HABITS_SCHEMA_VERSION;
    dirty = true;
  }
  if (data.workouts) { delete data.workouts; dirty = true; }
  if (data.aidenChats) { delete data.aidenChats; dirty = true; }
  if (dirty) saveData();
  return dirty;
}
runMigrations();

function localDateKey(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayKey() { return localDateKey(); }
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function dateNDaysAgo(n) {
  const d = new Date(); d.setDate(d.getDate() - n);
  return localDateKey(d);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
}

// Tab switching
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("view-" + t.dataset.view).classList.add("active");
    const titles = { weight: "Weigh In", challenge: "Challenge" };
    if (t.dataset.view !== "today") {
      document.getElementById("greeting").textContent = titles[t.dataset.view];
    }
    document.getElementById("today-date").style.display = t.dataset.view === "today" ? "" : "none";
    renderAll();
  });
});

function getLog(date) {
  if (!data.log[date]) data.log[date] = {};
  return data.log[date];
}

function streakForHabit(habitId) {
  let n = 0;
  const d = new Date();
  const todayK = localDateKey(d);
  const todayTicked = !!(data.log[todayK] && data.log[todayK][habitId]);
  if (!todayTicked) d.setDate(d.getDate() - 1);
  while (true) {
    const k = localDateKey(d);
    if (data.log[k] && data.log[k][habitId]) {
      n++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return n;
}

function popConfettiAt(el) {
  if (typeof confetti !== "function" || !el) return;
  const r = el.getBoundingClientRect();
  const x = (r.left + r.width / 2) / window.innerWidth;
  const y = (r.top + r.height / 2) / window.innerHeight;
  try {
    confetti({
      particleCount: 28, spread: 60, startVelocity: 26,
      scalar: 0.7, ticks: 80,
      origin: { x, y },
      colors: ["#10b981", "#0b0b0f", "#d1fadf", "#ffffff"],
      disableForReducedMotion: true,
    });
  } catch (e) {}
}

function renderToday() {
  const list = document.getElementById("habit-list");
  const today = getLog(todayKey());
  const allHabits = data.habits.slice();
  let html = `<div class="habits-grid">`;
  html += allHabits.map(h => {
    const done = !!today[h.id];
    const streak = streakForHabit(h.id);
    const streakHtml = streak > 0
      ? `<div class="habit-streak">${streak} day${streak === 1 ? "" : "s"}</div>`
      : "";
    return `
      <div class="habit-tile ${done ? "done" : ""}" data-id="${h.id}" title="${h.name}${streak > 0 ? ` · ${streak}-day streak` : ""}">
        <i class="ti ${h.icon} habit-icon" aria-hidden="true"></i>
        <div class="habit-name">${h.name}</div>
        ${streakHtml}
      </div>
    `;
  }).join("");
  html += `</div>`;
  list.innerHTML = html;
  list.querySelectorAll(".habit-tile").forEach(el => {
    el.addEventListener("click", () => {
      const id = Number(el.dataset.id);
      const tk = todayKey();
      const log = getLog(tk);
      const wasDone = !!log[id];
      if (wasDone) delete log[id]; else log[id] = true;
      if (Object.keys(log).length === 0) delete data.log[tk];
      if (!wasDone) popConfettiAt(el);
      saveData(); renderAll();
    });
  });

  const ticked = data.habits.filter(h => today[h.id]).length;
  const totalH = data.habits.length;
  if (document.getElementById("view-today").classList.contains("active")) {
    document.getElementById("greeting").innerHTML = `Today <span class="count">${ticked}/${totalH}</span>`;
  }
  const now = new Date();
  document.getElementById("today-date").textContent =
    now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}

// Monthly goal
function getCurrentMonthKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function getMonthName(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long" });
}
function getMonthlyProgress() {
  const monthKey = getCurrentMonthKey();
  const goal = (data.monthlyGoals || {})[monthKey] || null;
  const startOfMonth = new Date();
  startOfMonth.setDate(1); startOfMonth.setHours(0, 0, 0, 0);
  const thisMonth = (data.weights || []).filter(w => new Date(w.when) >= startOfMonth);
  if (thisMonth.length === 0) return { hasData: false, hasGoal: !!goal, goal, monthKey };
  const current = Number(thisMonth[0].kg);
  const startWeight = Number(thisMonth[thisMonth.length - 1].kg);
  const moved = startWeight - current;
  if (!goal) return { hasData: true, hasGoal: false, monthKey, startWeight, current, moved };
  const targetMove = startWeight - goal;
  const isCut = targetMove > 0;
  const isBulk = targetMove < 0;
  const toGoRaw = current - goal;
  let percent = 0;
  if (Math.abs(targetMove) > 0.01) percent = (moved / targetMove) * 100;
  percent = Math.max(0, Math.min(100, percent));
  const achieved = (isCut && current <= goal) || (isBulk && current >= goal);
  return {
    hasData: true, hasGoal: true, monthKey, goal, startWeight, current,
    moved, toGo: Math.abs(toGoRaw), percent, achieved,
  };
}
function isFirstWeightOfMonth() {
  const startOfMonth = new Date();
  startOfMonth.setDate(1); startOfMonth.setHours(0, 0, 0, 0);
  return (data.weights || []).filter(w => new Date(w.when) >= startOfMonth).length === 1;
}
function showGoalModal(monthKey, onDone) {
  const m = document.getElementById("goal-modal");
  if (!m) { if (onDone) onDone(); return; }
  const monthName = getMonthName(monthKey);
  document.getElementById("goal-modal-title").textContent = monthName + " goal";
  document.getElementById("goal-modal-sub").textContent =
    `What's your target weight by the end of ${monthName}?`;
  const input = document.getElementById("goal-input");
  input.value = "";
  m.classList.add("show");
  const save = document.getElementById("goal-save");
  const skip = document.getElementById("goal-skip");
  const cleanup = () => {
    m.classList.remove("show");
    save.removeEventListener("click", onSave);
    skip.removeEventListener("click", onSkip);
  };
  const onSave = () => {
    const v = Number(input.value);
    if (!v || v <= 0) { input.focus(); return; }
    if (!data.monthlyGoals) data.monthlyGoals = {};
    data.monthlyGoals[monthKey] = v;
    saveData(); cleanup(); renderAll();
    if (onDone) onDone();
  };
  const onSkip = () => { cleanup(); if (onDone) onDone(); };
  save.addEventListener("click", onSave);
  skip.addEventListener("click", onSkip);
  setTimeout(() => input.focus(), 100);
}
function renderMonthProgress() {
  const p = getMonthlyProgress();
  const cardLg = document.getElementById("month-progress-lg");
  if (!cardLg) return;
  if (!p.hasData && !p.hasGoal) { cardLg.style.display = "none"; return; }
  cardLg.style.display = "block";
  document.getElementById("mc-cap").textContent = getMonthName(p.monthKey).toUpperCase();
  const pctEl = document.getElementById("mc-pct");
  const subEl = document.getElementById("mc-sub");
  if (p.hasGoal && p.hasData) {
    pctEl.innerHTML = `${Math.round(p.percent)}<span class="sign">%</span>`;
    pctEl.classList.toggle("done", !!p.achieved);
    subEl.textContent = p.achieved ? "goal achieved" : "of your monthly goal";
  } else if (p.hasGoal) {
    pctEl.innerHTML = `0<span class="sign">%</span>`;
    subEl.textContent = "log a weight to start tracking";
  } else {
    pctEl.innerHTML = `—`;
    subEl.textContent = "tap edit to set this month's goal";
  }
  const lostEl = document.getElementById("mc-lost");
  if (p.hasData) {
    if (p.moved >= 0) { lostEl.textContent = `−${p.moved.toFixed(1)} kg`; lostEl.className = "mc-v accent"; }
    else { lostEl.textContent = `+${Math.abs(p.moved).toFixed(1)} kg`; lostEl.className = "mc-v danger"; }
  } else { lostEl.textContent = "—"; lostEl.className = "mc-v"; }
  document.getElementById("mc-togo").textContent =
    p.hasGoal && p.hasData ? (p.achieved ? "0.0 kg" : `${p.toGo.toFixed(1)} kg`) : "—";
  document.getElementById("mc-start").textContent = p.hasData ? `${p.startWeight} kg` : "—";
  document.getElementById("mc-goal").textContent = p.hasGoal ? `${p.goal} kg` : "Not set";
}
document.addEventListener("click", (e) => {
  if (e.target.closest("#mp-lg-edit")) showGoalModal(getCurrentMonthKey());
});

// Weight input
function showSavedToast(msg) {
  let t = document.getElementById("__saved_toast__");
  if (!t) {
    t = document.createElement("div");
    t.id = "__saved_toast__";
    t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);background:#0b0b0f;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;z-index:1000;opacity:0;transition:opacity .2s ease;pointer-events:none;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t.__h);
  t.__h = setTimeout(() => { t.style.opacity = "0"; }, 1400);
}

function wireWeightInput(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if (!input) return;
  let debounce = null;
  let activeEntryId = null;
  const trySave = (final) => {
    if (debounce) { clearTimeout(debounce); debounce = null; }
    const raw = String(input.value).trim();
    if (!final && /[.]$/.test(raw)) return false;
    const v = Number(raw);
    if (!v || v <= 0) {
      if (final) { activeEntryId = null; input.value = ""; }
      return false;
    }
    if (activeEntryId !== null) {
      const idx = data.weights.findIndex(e => e.id === activeEntryId);
      if (idx >= 0) {
        data.weights[idx].kg = v;
        data.weights[idx].when = new Date().toISOString();
      } else {
        activeEntryId = Date.now();
        data.weights.unshift({ id: activeEntryId, kg: v, when: new Date().toISOString() });
      }
    } else {
      activeEntryId = Date.now();
      data.weights.unshift({ id: activeEntryId, kg: v, when: new Date().toISOString() });
    }
    saveData();
    renderAll();
    if (final) {
      input.value = "";
      showSavedToast(`Saved ${v} kg`);
      const finishedId = activeEntryId;
      activeEntryId = null;
      const monthKey = getCurrentMonthKey();
      const needGoal = isFirstWeightOfMonth() && !((data.monthlyGoals || {})[monthKey]);
      if (needGoal) setTimeout(() => showGoalModal(monthKey), 250);
    }
    return true;
  };
  input.addEventListener("input", () => {
    if (debounce) clearTimeout(debounce);
    debounce = setTimeout(() => trySave(false), 1500);
  });
  input.addEventListener("blur", () => trySave(true));
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); trySave(true); input.blur(); }
  });
  if (btn) btn.addEventListener("click", () => trySave(true));
}
wireWeightInput("weight-input", "save-weight");
wireWeightInput("quick-weight", "quick-save-weight");

function renderWeighCard() {
  const cur = document.getElementById("weigh-latest");
  const deltaEl = document.getElementById("weigh-delta");
  if (!cur || !deltaEl) return;
  if (data.weights.length === 0) {
    cur.textContent = "—";
    deltaEl.textContent = "no entries";
    deltaEl.className = "strip-delta";
    return;
  }
  const latest = data.weights[0];
  cur.textContent = `${latest.kg} kg`;
  const cutoffMs = Date.now() - 7 * 24 * 3600 * 1000;
  const prior = data.weights.find(w => new Date(w.when).getTime() <= cutoffMs);
  if (prior) {
    const diff = latest.kg - prior.kg;
    const cls = diff < 0 ? "down" : (diff > 0 ? "up" : "");
    const sign = diff > 0 ? "+" : "";
    deltaEl.textContent = `${sign}${diff.toFixed(1)} vs 7d`;
    deltaEl.className = `strip-delta ${cls}`;
  } else {
    deltaEl.textContent = "first entry";
    deltaEl.className = "strip-delta";
  }
}

let __weightRangeDays = 30;
function renderWeightChart() {
  const wrap = document.getElementById("weight-chart");
  const N = __weightRangeDays;
  const lastIdx = N - 1;
  const cutoffDate = dateNDaysAgo(lastIdx);
  const entries = data.weights
    .filter(w => w.when.slice(0, 10) >= cutoffDate)
    .slice()
    .sort((a, b) => a.when.localeCompare(b.when));
  if (entries.length === 0) {
    wrap.innerHTML = `<div class="muted" style="text-align:center; padding: 16px 0;">No weight entries in the last ${N} days.</div>`;
    return;
  }
  const dayIndex = iso => {
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(iso); d.setHours(0,0,0,0);
    return lastIdx - Math.round((today - d) / (24 * 3600 * 1000));
  };
  const pts = entries.map(e => ({ i: dayIndex(e.when), kg: e.kg }));
  const kgs = pts.map(p => p.kg);
  const min = Math.min(...kgs);
  const max = Math.max(...kgs);
  const pad = Math.max((max - min) * 0.25, 0.5);
  const yMin = min - pad;
  const yMax = max + pad;
  const W = 320, H = 150, padX = 24, padY = 24;
  const xFor = i => padX + (i / lastIdx) * (W - 2 * padX);
  const yFor = kg => H - padY - ((kg - yMin) / Math.max(yMax - yMin, 0.001)) * (H - 2 * padY);
  const sp = pts.map(p => ({ x: xFor(p.i), y: yFor(p.kg) }));
  function smoothPath(points) {
    if (points.length === 0) return "";
    if (points.length === 1) return `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
    let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    return d;
  }
  const path = smoothPath(sp);
  const dots = sp.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--accent)"/>`).join("");
  const latest = pts[pts.length - 1];
  const first = pts[0];
  const totalDiff = (latest.kg - first.kg).toFixed(1);
  const diffSign = totalDiff > 0 ? "+" : "";
  const diffColor = totalDiff < 0 ? "var(--accent)" : (totalDiff > 0 ? "var(--danger)" : "var(--muted)");
  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width: 100%; height: auto; display: block;" preserveAspectRatio="none">
      <line x1="${padX}" y1="${H - padY}" x2="${W - padX}" y2="${H - padY}" stroke="var(--border)" stroke-width="1"/>
      <line x1="${padX}" y1="${padY}" x2="${padX}" y2="${H - padY}" stroke="var(--border)" stroke-width="1"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      <text x="${padX - 4}" y="${yFor(max).toFixed(1) + 3}" font-size="9" fill="var(--muted)" text-anchor="end">${max.toFixed(1)}</text>
      <text x="${padX - 4}" y="${yFor(min).toFixed(1) + 3}" font-size="9" fill="var(--muted)" text-anchor="end">${min.toFixed(1)}</text>
    </svg>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 4px;">
      <span>${N} days ago</span>
      <span style="color: ${diffColor}; font-weight: 600;">${diffSign}${totalDiff} kg over period</span>
      <span>Today</span>
    </div>
  `;
}

function renderWeight() {
  const toggle = document.getElementById("weight-range-toggle");
  if (toggle && !toggle.dataset.wired) {
    toggle.dataset.wired = "1";
    toggle.querySelectorAll(".range-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const days = Number(btn.dataset.range);
        if (!days) return;
        __weightRangeDays = days;
        toggle.querySelectorAll(".range-btn").forEach(b => b.classList.toggle("active", b === btn));
        document.getElementById("weight-range-title").textContent = `Last ${days} days`;
        renderWeightChart();
      });
    });
  }
  if (toggle) {
    toggle.querySelectorAll(".range-btn").forEach(b => {
      b.classList.toggle("active", Number(b.dataset.range) === __weightRangeDays);
    });
  }
  document.getElementById("weight-range-title").textContent = `Last ${__weightRangeDays} days`;
  renderWeightChart();
  const ul = document.getElementById("weight-list");
  if (data.weights.length === 0) {
    ul.innerHTML = `<li class="muted" style="justify-content:center;">No weight entries yet.</li>`;
    return;
  }
  ul.innerHTML = data.weights.slice(0, 30).map(w => `
    <li>
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 600;">${w.kg} kg</div>
        <div class="muted" style="font-size: 12px;">${fmtDateTime(w.when)}</div>
      </div>
      <button class="btn danger" data-id="${w.id}">Delete</button>
    </li>
  `).join("");
  ul.querySelectorAll(".btn.danger").forEach(b => {
    b.addEventListener("click", () => {
      const id = Number(b.dataset.id);
      data.weights = data.weights.filter(w => w.id !== id);
      saveData(); renderAll();
    });
  });
}

// Challenge data
const FASTING_BENEFITS = [
  { at: 0,  stage: "Hour 0",  body: "Last meal is digesting. Insulin elevated, blood glucose stable. Drink water." },
  { at: 1,  stage: "Hour 1",  body: "Stomach actively emptying. Digestive enzymes peaking." },
  { at: 2,  stage: "Hour 2",  body: "Insulin starting to drop. Liver shifting from storage to release." },
  { at: 3,  stage: "Hour 3",  body: "Food moving into small intestine. Blood sugar settling." },

let __challengeTickerId = null;

function ensureChallengeData() {
  if (!data.challenges) data.challenges = { fasting: null, alcohol: null };
  if (!data.challenges.fasting) data.challenges.fasting = { startedAt: null };
  if (!data.challenges.alcohol) data.challenges.alcohol = { startedAt: null };
}
function hoursSince(iso) {
  if (!iso) return 0;
  return (Date.now() - new Date(iso).getTime()) / (1000 * 60 * 60);
}
function formatFastClock(h) {
  const totalMin = Math.floor(h * 60);
  const hh = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${hh}h ${String(m).padStart(2, "0")}m`;
}
function formatAlcoholClock(h) {
  const totalMin = Math.floor(h * 60);
  const days = Math.floor(totalMin / (60 * 24));
  const hh = Math.floor((totalMin % (60 * 24)) / 60);
  const m = totalMin % 60;
  if (days > 0) return `${days}d ${hh}h ${String(m).padStart(2, "0")}m`;
  return `${hh}h ${String(m).padStart(2, "0")}m`;
}
function currentStage(benefits, h) {
  let cur = benefits[0];
  for (const b of benefits) { if (b.at <= h) cur = b; else break; }
  return cur;
}
function formatBenefitHourLabel(at) {
  if (at < 24) return `${at}h`;
  const days = Math.round(at / 24);
  return `${days}d`;
}

function renderChallenge() {
  ensureChallengeData();
  const root = document.getElementById("view-challenge");
  if (!root) return;
  const fast = data.challenges.fasting;
  const alc = data.challenges.alcohol;
  root.innerHTML = `
    <div class="challenge-intro">
      <div class="label">Challenges</div>
      <h2>Build a streak</h2>
      <p>Tap start. Your body changes by the hour.</p>
    </div>
    ${renderChallengeCard({
      id: "fasting", title: "Intermittent fasting", sub: "Hour-by-hour body changes",
      icon: "ti-hourglass", active: !!fast.startedAt, hours: hoursSince(fast.startedAt),
      benefits: FASTING_BENEFITS, formatClock: formatFastClock,
      startLabel: "Start fast", stopLabel: "End fast",
    })}
    ${renderChallengeCard({
      id: "alcohol", title: "No alcohol", sub: "Sober streak",
      icon: "ti-bottle-off", active: !!alc.startedAt, hours: hoursSince(alc.startedAt),
      benefits: ALCOHOL_BENEFITS, formatClock: formatAlcoholClock,
      startLabel: "Start streak", stopLabel: "Reset streak",
    })}
  `;
  document.querySelectorAll(".challenge-start-btn[data-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      data.challenges[btn.dataset.id].startedAt = new Date().toISOString();
      saveData(); renderChallenge();
    });
  });
  document.querySelectorAll(".challenge-stop-btn[data-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      if (!confirm(id === "fasting" ? "End your fast?" : "Reset your no-alcohol streak?")) return;
      data.challenges[id].startedAt = null;
      saveData(); renderChallenge();
    });
  });
  startChallengeTicker();
}

function renderChallengeCard(cfg) {
  if (!cfg.active) {
    return `
      <div class="challenge-card">
        <div class="challenge-head">
          <div class="ico"><i class="ti ${cfg.icon}"></i></div>
          <div class="meta">
            <h3>${cfg.title}</h3>
            <div class="sub">${cfg.sub}</div>
          </div>
        </div>
        <button class="challenge-start-btn" data-id="${cfg.id}">
          <i class="ti ti-player-play"></i> ${cfg.startLabel}
        </button>
      </div>
    `;
  }
  const cur = currentStage(cfg.benefits, cfg.hours);
  const reached = cfg.benefits.filter(b => b.at <= cfg.hours);
  const past = reached.slice(-6).reverse();
  return `
    <div class="challenge-card active">
      <div class="challenge-head">
        <div class="ico"><i class="ti ${cfg.icon}"></i></div>
        <div class="meta">
          <h3>${cfg.title}</h3>
          <div class="sub">${cfg.sub}</div>
        </div>
      </div>
      <div class="challenge-timer">
        <div class="big" data-clock="${cfg.id}">${cfg.formatClock(cfg.hours)}</div>
        <div class="label">elapsed</div>
      </div>
      <div class="challenge-now">
        <div class="stage">${escapeHtml(cur.stage)}</div>
        <div class="text">${escapeHtml(cur.body)}</div>
      </div>
      <div class="challenge-feed">
        <div class="feed-cap">Milestones reached</div>
        ${past.slice(1).map(b => `
          <div class="feed-row past">
            <div class="h">${formatBenefitHourLabel(b.at)}</div>
            <div class="b"><strong>${escapeHtml(b.stage)}</strong> — ${escapeHtml(b.body)}</div>
          </div>
        `).join("")}
      </div>
      <button class="challenge-stop-btn" data-id="${cfg.id}">${cfg.stopLabel}</button>
    </div>
  `;
}

function startChallengeTicker() {
  if (__challengeTickerId) return;
  __challengeTickerId = setInterval(() => {
    const view = document.getElementById("view-challenge");
    if (!view || !view.classList.contains("active")) return;
    ensureChallengeData();
    const fast = data.challenges.fasting;
    const alc = data.challenges.alcohol;
    if (fast.startedAt) {
      const h = hoursSince(fast.startedAt);
      const clockEl = document.querySelector('[data-clock="fasting"]');
      if (clockEl) clockEl.textContent = formatFastClock(h);
      if (Math.floor(h * 60) % 60 === 0) renderChallenge();
    }
    if (alc.startedAt) {
      const h = hoursSince(alc.startedAt);
      const clockEl = document.querySelector('[data-clock="alcohol"]');
      if (clockEl) clockEl.textContent = formatAlcoholClock(h);
    }
  }, 1000);
}

function renderAll() {
  renderToday();
  renderWeighCard();
  renderMonthProgress();
  renderWeight();
  renderChallenge();
}
renderAll();

// Local PIN gate
const APP_PIN = "6663";
const UNLOCKED_KEY = "fitness_unlocked";

function setLoginStatus(text, kind) {
  const s = document.getElementById("login-status");
  if (!s) return;
  s.textContent = text || "";
  s.className = kind || "";
}
function showLoginScreen() { document.getElementById("login-screen").classList.add("show"); }
function hideLoginScreen() { document.getElementById("login-screen").classList.remove("show"); }

function unlockApp() {
  localStorage.setItem(UNLOCKED_KEY, "1");
  hideLoginScreen();
  setLoginStatus("");
  try { renderAll(); } catch (e) {}
}

function initAuth() {
  if (localStorage.getItem(UNLOCKED_KEY) === "1") { hideLoginScreen(); return; }
  showLoginScreen();
  setTimeout(() => { const i = document.getElementById("login-pin"); if (i) i.focus(); }, 100);
}

document.getElementById("login-unlock-btn").addEventListener("click", () => {
  const input = document.getElementById("login-pin");
  const pin = (input.value || "").trim();
  if (pin === APP_PIN) {
    unlockApp();
  } else {
    setLoginStatus("Wrong PIN. Try again.", "error");
    input.value = "";
    input.focus();
  }
});
document.getElementById("login-pin").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("login-unlock-btn").click();
});
initAuth();

// Midnight rollover
let lastRenderedDay = todayKey();
function checkDateRollover() {
  const now = todayKey();
  if (now !== lastRenderedDay) {
    lastRenderedDay = now;
    renderAll();
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDateRollover(); });
window.addEventListener("pageshow", checkDateRollover);
window.addEventListener("focus", checkDateRollover);
setInterval(checkDateRollover, 30 * 1000);

// Nuke old service worker + caches
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  }).catch(() => {});
  if (window.caches && caches.keys) {
    caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
  }
}
</script>
